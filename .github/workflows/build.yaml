name: Build

on:
  push:
    branches:
    - master
    - main
    tags:
    - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        type: choice
        options:
        - dev
        - testing
        - release
        default: dev

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_DIR: buildscripts/ci

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64,  qt_host: linux,       qt_arch: linux_gcc_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure workflow
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_BUILD_MODE: ${{ inputs.build_mode }}
      run: |
        BUILD_MODE=devel
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          BUILD_MODE=stable
        elif [ "${EVENT_NAME}" == "workflow_dispatch" ]; then
          case "${INPUT_BUILD_MODE}" in
            testing) BUILD_MODE=testing ;;
            release) BUILD_MODE=stable ;;
            *) BUILD_MODE=devel ;;
          esac
        fi
        echo "BUILD_MODE: $BUILD_MODE"

        cmake -DEVENT=${EVENT_NAME} \
              -DBUILD_MODE=${BUILD_MODE} \
              -DARTIFACT_INFO="Lin_${{ matrix.arch }}_${GITHUB_REF_NAME}" \
              -P ${CI_DIR}/common/ci_configure.cmake

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-ccache-
        restore-keys: ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        sudo apt-get update && sudo apt-get install -y ccache
        bash ./muse/buildscripts/ci/tools/setup_ccache_config.sh

    - name: Register gcc problem matcher
      run: echo "::add-matcher::.github/problem_matchers/gcc.json"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.2'
        host: ${{ matrix.qt_host }}
        target: 'desktop'
        arch: ${{ matrix.qt_arch }}
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true

    - name: Setup environment
      run: |
        bash ${CI_DIR}/linux/setup.sh

    - name: Build
      run: |
        source $HOME/build_tools/environment.sh
        cmake -P ${CI_DIR}/linux/ci_build.cmake

    - name: Show ccache stats
      run: |
        ccache -sv

    - name: Check bundled deps are self-contained
      run: |
        APP=$(find build.install -type f -name 'audatown*' -path '*/bin/*' -print -quit)
        [ -n "$APP" ] || { echo "error: app binary not found"; exit 1; }
        bash ${CI_DIR}/linux/check_self_contained.sh "$APP"

    - name: Upload build for self-test
      uses: actions/upload-artifact@v7
      with:
        name: selftest-build-linux-${{ matrix.arch }}
        path: ./build.install/
        retention-days: 1

    - name: Package
      run: |
        cmake -DPACKARCH=${{ matrix.arch }} -P ${CI_DIR}/linux/package.cmake

    - name: Checksum
      run: |
        bash ./muse/buildscripts/ci/tools/checksum.sh

    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v7
      with:
        name: Audatown-linux-${{ matrix.arch }}
        path: ./build.artifacts/
        retention-days: 14

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache

  plugin-registration-self-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64,  qt_host: linux,       qt_arch: linux_gcc_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64 }
    runs-on: ${{ matrix.runner }}
    name: Plugin registration self-test ${{ matrix.arch }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup environment
      run: |
        bash ${CI_DIR}/linux/setup.sh

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.2'
        host: ${{ matrix.qt_host }}
        target: 'desktop'
        arch: ${{ matrix.qt_arch }}
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: selftest-build-linux-${{ matrix.arch }}
        path: ./build.install

    - name: Run plugin registration app self-test
      run: |
        source $HOME/build_tools/environment.sh
        export LD_LIBRARY_PATH="./build.install/lib:${LD_LIBRARY_PATH}"
        find ./build.install/bin/ -type f -exec chmod +x {} +
        APP_BIN=$(find "./build.install/bin/" -type f -name "audatown*" -print -quit)
        [ -n "$APP_BIN" ] || { echo "error: app binary not found"; exit 1; }
        QT_QPA_PLATFORM=minimal:enable_fonts "$APP_BIN" --plugin-registration-self-test

  delete-selftest-artifacts:
    needs: [plugin-registration-self-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
    - name: Delete self-test artifact
      uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
      with:
        failOnError: false
        name: selftest-build-linux-${{ matrix.arch }}

  macos:
    name: macOS
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure workflow
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_BUILD_MODE: ${{ inputs.build_mode }}
      run: |
        BUILD_MODE=devel
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          BUILD_MODE=stable
        elif [ "${EVENT_NAME}" == "workflow_dispatch" ]; then
          case "${INPUT_BUILD_MODE}" in
            testing) BUILD_MODE=testing ;;
            release) BUILD_MODE=stable ;;
            *) BUILD_MODE=devel ;;
          esac
        fi
        echo "BUILD_MODE: $BUILD_MODE"

        cmake -DEVENT=${EVENT_NAME} \
              -DBUILD_MODE=${BUILD_MODE} \
              -DARTIFACT_INFO="Mac_universal_${GITHUB_REF_NAME}" \
              -P ${CI_DIR}/common/ci_configure.cmake

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-ccache-
        restore-keys: ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        brew install ccache
        bash ./muse/buildscripts/ci/tools/setup_ccache_config.sh

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.2'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true

    - name: Setup environment
      run: |
        bash ${CI_DIR}/macos/setup.sh

    - name: Build
      env:
        OSX_ARCHITECTURES: 'x86_64;arm64'
      run: |
        source $HOME/build_tools/environment.sh
        cmake -P ${CI_DIR}/macos/ci_build.cmake

    - name: Show ccache stats
      run: |
        ccache -sv

    # No signing secrets: make_dmg.sh falls back to an ad-hoc signature
    - name: Package
      run: |
        source $HOME/build_tools/environment.sh
        cmake -DPACKARCH=universal -P ${CI_DIR}/macos/package.cmake

    - name: Checksum
      run: |
        bash ./muse/buildscripts/ci/tools/checksum.sh

    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v7
      with:
        name: Audatown-macos
        path: ./build.artifacts/
        retention-days: 14

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022,   arch: x86_64,  qt_host: windows,       qt_arch: win64_msvc2022_64 }
          - { runner: windows-11-arm, arch: aarch64, qt_host: windows_arm64, qt_arch: win64_msvc2022_arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 3
        submodules: recursive

    - name: Configure workflow
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_BUILD_MODE: ${{ inputs.build_mode }}
      run: |
        BUILD_MODE=devel
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          BUILD_MODE=stable
        elif [ "${EVENT_NAME}" == "workflow_dispatch" ]; then
          case "${INPUT_BUILD_MODE}" in
            testing) BUILD_MODE=testing ;;
            release) BUILD_MODE=stable ;;
            *) BUILD_MODE=devel ;;
          esac
        fi
        echo "BUILD_MODE: $BUILD_MODE"

        cmake -DEVENT=${EVENT_NAME} \
              -DBUILD_MODE=${BUILD_MODE} \
              -DARTIFACT_INFO="Win_${{ matrix.arch }}_${GITHUB_REF_NAME}" \
              -P ${CI_DIR}/common/ci_configure.cmake

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-ccache-
        restore-keys: ${{runner.os}}-${{runner.arch}}-ccache-
    - name: Setup ccache
      run: |
        choco install -y ccache
        bash ./muse/buildscripts/ci/tools/setup_ccache_config.sh

    - name: Install WiX 3 (WoA)
      if: matrix.runner == 'windows-11-arm'
      shell: pwsh
      run: |
        $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
        $dst = "$env:RUNNER_TEMP\wix3"
        New-Item -ItemType Directory -Force $dst | Out-Null
        Invoke-WebRequest -Uri $url -OutFile "$dst\wix.zip"
        Expand-Archive -Path "$dst\wix.zip" -DestinationPath $dst -Force
        "WIX=$dst" | Out-File $env:GITHUB_ENV  -Append -Encoding utf8
        $dst       | Out-File $env:GITHUB_PATH -Append -Encoding utf8

    - name: Register msvc problem matcher
      run: echo "::add-matcher::.github/problem_matchers/msvc.json"

    - name: Setup x64 Python (WoA)
      if: matrix.runner == 'windows-11-arm'
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        architecture: x64

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        setup-python: ${{ matrix.runner != 'windows-11-arm' }}
        version: '6.11.2'
        host: ${{ matrix.qt_host }}
        target: 'desktop'
        arch: ${{ matrix.qt_arch }}
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
        cache: true
        # https://github.com/miurahr/aqtinstall/pull/1000#issuecomment-4109913885
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
        py7zrversion: '@git+https://github.com/miurahr/py7zr.git'

    - name: Setup environment
      shell: bash
      run: |
        cmake -P ${CI_DIR}/windows/setup.cmake

    - name: Build
      shell: bash
      run: |
        source /c/build_tools/environment.sh
        cmake -P ${CI_DIR}/windows/ci_build.cmake

    - name: Show ccache stats
      run: |
        ccache -sv

    # No signing secrets: package.cmake skips signing
    - name: Package
      shell: bash
      run: |
        cmake -DPACKARCH=${{ matrix.arch }} -P ${CI_DIR}/windows/package.cmake

    - name: Checksum
      shell: bash
      run: |
        bash ./muse/buildscripts/ci/tools/checksum.sh

    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v7
      with:
        name: Audatown-windows-${{ matrix.arch }}
        path: ./build.artifacts/
        retention-days: 14

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      shell: bash
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT
    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache
